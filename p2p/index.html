        const theme = saved === 'light' || saved === 'dark' ? saved : 'system';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = theme === 'system' ? 'light dark' : theme;
        document.querySelector('meta[name="theme-color"]').content = (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) ? '#141c17' : '#f5f5f0';
      } catch { /* Follow the system when preferences cannot be read. */ }
    </script>
