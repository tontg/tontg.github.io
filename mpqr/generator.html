<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-BFy38ze2n3zCvXUHek+Ejz/BM2vIZG5/Iatrnzpzp8k='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b5b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EMV QR">
    <title>EMV Merchant QR Generator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon-192.png">
    <link rel="icon" href="icons/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="icons/app-icon.svg" color="#176b5b">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <div>
          <p class="eyebrow">EMV Merchant-Presented QR</p>
          <h1>Generate a payment QR code</h1>
        </div>
        <div class="intro-actions">
          <p class="lede">Enter YAML fields like <code>- "00": "01"</code>. CRC ID 63 length 04 is calculated automatically.</p>
        </div>
      </section>

      <section class="workspace generator-workspace" aria-label="QR generator input and output">
        <div class="capture-panel">
          <div class="generator-actions">
            <button id="loadSampleButton" type="button" class="secondary-button">Load sample</button>
            <button id="loadYamlFileButton" type="button" class="secondary-button">Load YAML file</button>
            <input id="yamlFileInput" class="hidden-input" type="file" accept=".yaml,.yml,text/yaml,text/x-yaml,text/plain">
            <label class="select-label" for="errorCorrectionSelect">
              QR-Code error correction
              <select id="errorCorrectionSelect">
                <option value="L" selected>low</option>
                <option value="M">standard</option>
                <option value="Q">quartile</option>
                <option value="H">high</option>
              </select>
            </label>
            <!--a class="button-link" href="samples/valid-emvqr-without-crc.yaml" target="_blank" rel="noreferrer">Sample YAML</a-->
          </div>
          <div class="input-group">
            <label for="yamlInput">YAML input</label>
            <textarea id="yamlInput" maxlength="65536" class="generator-input" spellcheck="false"></textarea>
          </div>
          <div id="generatorStatus" class="status-box">Ready.</div>
        </div>

        <div class="result-panel">
          <div class="summary-grid">
            <div>
              <span>Characters</span>
              <strong id="generatedChars">0</strong>
            </div>
            <div>
              <span>Bytes</span>
              <strong id="generatedBytes">0</strong>
            </div>
            <div>
              <span>CRC</span>
              <strong id="generatedCrc">-</strong>
            </div>
          </div>

          <div class="result-block">
            <h2>QR-Code image</h2>
            <div class="generator-actions">
              <button id="downloadQrSvgButton" type="button" class="secondary-button" disabled>Download SVG</button>
              <button id="downloadQrPngButton" type="button" class="secondary-button" disabled>Download PNG</button>
              <button id="downloadQrWebpButton" type="button" class="secondary-button" disabled hidden>Download WebP</button>
            </div>
            <div id="qrImage" class="qr-output" data-resizable="true" data-resize-default="320" data-resize-min="180"></div>
          </div>

          <div class="result-block">
            <h2 id="generatedTextTitle">Generated text</h2>
            <div class="generator-actions">
              <button id="parseGeneratedTextButton" type="button" class="secondary-button" disabled>Parse text</button>
            </div>
            <pre id="generatedText"></pre>
          </div>

          <div class="result-block">
            <h2 id="generatedHexTitle">Generated hexadecimal string</h2>
            <pre id="generatedHex"></pre>
          </div>
        </div>
      </section>
    </main>

    <script>
      const EMVQR_GENERATOR_STATIC_FIELDS = {
        fields: [
          { "00": "01" },
          { "01": "11" },
          {
            "26": [
              { "00": "COM.EXAMPLE.PAY" },
              { "01": "MERCHANT123" }
            ]
          },
          { "52": "5812" },
          { "53": "840" },
          { "54": "12.34" },
          { "58": "US" },
          { "59": "EXAMPLE MERCHANT" },
          { "60": "NEW YORK" },
          {
            "62": [
              { "05": "INV-1001" }
            ]
          }
        ]
      };
      window.emvQrGeneratorConfig = EMVQR_GENERATOR_STATIC_FIELDS;
    </script>
    <script defer src="vendor/js-yaml.min.js" integrity="sha256-MjkVYGAZkLtuDaq9gQajWmpTneCIUyQTkxpwpMtPR2k="></script>
    <script defer src="vendor/qrcode-generator.js" integrity="sha256-eeyG+ChWAFsciHkFz8z8++w4Icphx/1alS+qX3ePeRw="></script>
    <script defer src="CRC16.js" integrity="sha256-9+sdLG+ch++VxVYVDeel9+UaVrOBhpzxqW2nzOO2Gzo="></script>
    <script defer src="emv-codec.js" integrity="sha256-/qzuIrXv2bQIe7ONvnC15vGVOawwkd5rD3bco2HbkzY="></script>
    <script defer src="emv-format.js" integrity="sha256-/r8ha7wXTOK4n0viXICikC62+IcsvFBz2Wo3NEBrUok="></script>
    <script defer src="emv-analyzer.js" integrity="sha256-7faZSBmj0bLtX3QsWs46tQaHCUrp7MpqNVzHNZOe9GI="></script>
    <script defer src="qr-resizer.js" integrity="sha256-GhlHkglDXB+Bmr93tbevAYWPO/JRnIDvtUAMRmxkXYs="></script>
    <script defer src="qr-output.js" integrity="sha256-mkyaLx9xlhyG20GwLqZi2vFtCFpsSXV83Y4pwD9kArM="></script>
    <script defer src="site-menu.js" integrity="sha256-HxZM7+yYx7CmbhMsPzWFDT/VN/bvmsYMdwyWmjkTWTQ="></script>
    <script defer src="pwa.js" integrity="sha256-9mKDGo+H6ascu4XSmDlyb4SitC3SZWJgCepU76LMAms="></script>
    <script defer src="emv-yaml.js" integrity="sha256-VONJIrBQGC1YAwyE0Fxb7l5gwx9T0GeqW3ykSEO6juE="></script>
    <script defer src="generator.js" integrity="sha256-3/E08C/ru3jYLNRZ8OldYBO67yKxbjBLQ2CRx+tY/bw="></script>
  </body>
</html>
