<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' ; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b5b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EMV QR">
    <title>EMV Merchant QR Validator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon-192.png">
    <link rel="icon" href="icons/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="icons/app-icon.svg" color="#176b5b">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="validator-page">
    <main class="shell">
      <section class="intro">
        <div>
          <p class="eyebrow">Merchant-Presented QR-Code</p>
          <h1>Validate QR image files</h1>
        </div>
        <div class="intro-actions">
          <p class="lede">Select one or more image files and check which contain valid EMV payment QR codes.</p>
        </div>
      </section>

      <section class="capture-panel">
        <div class="generator-actions">
          <div class="input-group validator-file-input">
            <label for="validatorFiles">Image files</label>
            <input id="validatorFiles" type="file" accept="image/*" multiple>
          </div>
          <label class="checkbox">
            <input id="validatorUseOpenCv" type="checkbox" checked>
            <span>OpenCV preprocessing</span>
          </label>
          <label class="select-label" for="validatorDisplayFilter">
            <span>Display</span>
            <select id="validatorDisplayFilter">
              <option value="all" selected>All</option>
              <option value="valid">Only valid</option>
              <option value="invalid">Only invalid</option>
            </select>
          </label>
          <button id="downloadValidatorZipButton" type="button" class="secondary-button" disabled>Download report zip</button>
          <button id="printValidatorButton" type="button" class="secondary-button">Print</button>
        </div>
        <div id="validatorStatus" class="status-box" role="status" aria-live="polite">Ready.</div>
        <div class="progress-block" aria-label="Validation progress">
          <div class="progress-track">
            <div id="validatorProgressBar" class="progress-fill" role="progressbar" aria-label="Scanned images" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
          </div>
          <div id="validatorProgressText" class="progress-text">0/0 (0%)</div>
        </div>
      </section>

      <section class="result-panel validator-results">
        <div class="summary-grid">
          <div>
            <span>Files</span>
            <strong id="validatorTotal">0</strong>
          </div>
          <div>
            <span>Valid EMV QR</span>
            <strong id="validatorValid">0</strong>
          </div>
          <div>
            <span>Invalid or unreadable</span>
            <strong id="validatorInvalid">0</strong>
          </div>
        </div>

        <div class="table-wrap">
          <table class="validator-table">
            <thead>
              <tr>
                <th>File name</th>
                <th>Thumbnail</th>
                <th>QR</th>
                <th>EMV valid</th>
                <th>Bytes</th>
                <th>Seconds</th>
                <th>Errors</th>
                <th>Warnings</th>
                <th>Messages</th>
              </tr>
            </thead>
            <tbody id="validatorRows">
              <tr>
                <td colspan="9">No files selected.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script defer src="vendor/mcc-codes.js" integrity="sha256-C/k8kFHVHgzhqjr5VX91fL068Xf7ol3kc8it9EfQiew="></script>

    <script defer src="vendor/jsQR.js" integrity="sha256-SKB/b/wsYfVr6NwKNlay20k5MzYJfDHxxLCUnS5iwtM="></script>
    <script defer src="CRC16.js" integrity="sha256-9+sdLG+ch++VxVYVDeel9+UaVrOBhpzxqW2nzOO2Gzo="></script>
    <script defer src="emv-codec.js" integrity="sha256-/qzuIrXv2bQIe7ONvnC15vGVOawwkd5rD3bco2HbkzY="></script>
    <script defer src="emv-format.js" integrity="sha256-/r8ha7wXTOK4n0viXICikC62+IcsvFBz2Wo3NEBrUok="></script>
    <script defer src="emv-analyzer.js" integrity="sha256-7faZSBmj0bLtX3QsWs46tQaHCUrp7MpqNVzHNZOe9GI="></script>
    <script defer src="vendor/iso4217-codes.js" integrity="sha256-AGCqpbNruXAO0nBXU5w5KigVdigaZowqYANooo+LNlI="></script>
    <script defer src="vendor/iso3166-alpha2-codes.js" integrity="sha256-orBO1ApKPuOXKK+M1X+piHfz4oEybrEgVh1MibteAPs="></script>
    <script defer src="vendor/iso639-language-codes.js" integrity="sha256-IBDooHeqZP5q++PHWsUTxRp52qS4PU5sX18krKp8mbM="></script>
    <script defer src="opencv-loader.js" integrity="sha256-1Ts2cQLyNEcFreMh+llv6JYodtJOyLX5utJEbdDYpDM="></script>
    <script defer src="qr-decoder.js" integrity="sha256-6DJuTZKM8aVP+lVNx7ZwHs4Q+7LbRWwVrEjNY159xbM="></script>
    <script defer src="qr-scanner.js" integrity="sha256-nMP/c/WdNGgnTT+reuUOHlC/WA7Exe6WwY9RfhKMzOQ="></script>
    <script defer src="site-menu.js" integrity="sha256-HxZM7+yYx7CmbhMsPzWFDT/VN/bvmsYMdwyWmjkTWTQ="></script>
    <script defer src="pwa.js" integrity="sha256-9mKDGo+H6ascu4XSmDlyb4SitC3SZWJgCepU76LMAms="></script>
    <script defer src="validator.js" integrity="sha256-ku5HVTJgQEB50dN4QXntTTqVaFFxHAI53wtgbakiGqs="></script>
  </body>
</html>
